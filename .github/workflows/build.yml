name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单元测试（失败则不出包）
        run: python -m unittest discover -s tests

      - name: 打包（PyInstaller 单文件 GUI）
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name agent-cleaner --icon assets/icon.ico main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: agent-cleaner-${{ matrix.os }}
          path: |
            dist/agent-cleaner
            dist/agent-cleaner.exe
          if-no-files-found: error
