name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg: agent-cleaner-windows
          - os: macos-latest
            pkg: agent-cleaner-macos
          - os: ubuntu-latest
            pkg: agent-cleaner-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单元测试（失败则不出包）
        run: python -m unittest discover -s tests

      - name: 安装 tkinter（macOS 的 setup-python 默认不带，PyInstaller 打包 GUI 需要）
        if: runner.os == 'macOS'
        run: brew install python-tk@3.12

      - name: 打包（PyInstaller 单文件 GUI）
        run: |
          pip install pyinstaller pillow
          pyinstaller --onefile --windowed --name ${{ matrix.pkg }} --icon assets/icon.ico main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: dist/${{ matrix.pkg }}*
          if-no-files-found: error

  # 打 tag（v*）时自动发布到 GitHub Release，附三平台安装包
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 Release 需要写权限（默认 token 只有 read）
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: agent-cleaner-*
          merge-multiple: true

      - name: 清理旧 Release（重发同名 tag 时删除旧 Release，避免残留旧命名资产）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes
            echo "已删除旧 Release"
          else
            echo "无旧 Release，跳过清理"
          fi

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
